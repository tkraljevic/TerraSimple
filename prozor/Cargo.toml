[package]
name = "prozor"
version = "0.0.2"
edition = "2024"
license = "EUPL-1.2"
publish = false

[dependencies]
chrono = "0.4"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11"] }
fluent-bundle = "0.16"
image = { version = "0.25.10", default-features = false, features = ["png"] }
karta = { path = "../karta", version = "0.0.0" }
koordinate = { path = "../koordinate", version = "0.0.0" }
qgis = { path = "../qgis", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slojevi = { path = "../slojevi", version = "0.0.0" }
geopaket = { path = "../geopaket", version = "0.0.0" }
rfd = "0.18"
unic-langid = "0.9"

[dev-dependencies]
geometrija = { path = "../geometrija", version = "0.0.0" }
egui_kittest = "0.37.0"
rusqlite = "0.41"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
