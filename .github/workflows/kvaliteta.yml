name: Redovna provjera
on:
  pull_request:
  push:
    branches: [master, proba]
permissions:
  contents: read
concurrency:
  group: kvaliteta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provjera:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: alati
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov*
            ~/.cargo/bin/cargo-deny*
          key: alati-${{ runner.os }}-${{ runner.arch }}-llvm-cov-0.9.1-deny-0.20.2
      - name: Priprema alata
        if: steps.alati.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      # Testovi crtanja trebaju karticu, a Linux na CI-ju ima samo softversku.
      - name: Softverska kartica
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Provjera
        run: cargo xtask provjera
