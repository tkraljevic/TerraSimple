name: Duboka provjera
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duboka-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provjera:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: alati
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: alati-${{ runner.os }}-${{ runner.arch }}-mutants-27.1.0
      - name: Priprema alata
        if: steps.alati.outputs.cache-hit != 'true'
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Provjera
        run: cargo xtask provjera-duboka
