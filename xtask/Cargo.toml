[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
chrono = { version = "0.4", features = ["serde"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
